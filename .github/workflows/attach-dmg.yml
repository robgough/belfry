name: Attach DMG to a release

# Builds the signed + notarized DMG for an already-published version (from
# its release zip) and attaches it to that GitHub release. For releases cut
# before the release workflow made DMGs itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version (YYYY.MM.N)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    if: github.actor == github.repository_owner
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode (image default, released)
        run: |
          set -euo pipefail
          [ -d /Applications/Xcode.app ] || { echo "::error::no /Applications/Xcode.app"; exit 1; }
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      # Inputs come from a write-access user, but they still reach a shell:
      # validate the shape rather than interpolate `${{ }}` into `run:`.
      # No Metal-toolchain step: make_app.sh no longer builds via --arch, so the
      # build never enters XCBuild, and it's XCBuild that demands the Metal
      # toolchain *component*. The ordinary path just runs `xcrun metal`, which
      # works on a stock runner — which is exactly why `swift test` passed on
      # every runner the universal build failed on.

      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/belfry-signing.keychain-db"
          KC_PASS="$(uuidgen)"
          P12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$P12"
          # Let codesign use the key without a UI prompt. This is the right call
          # here in a way it isn't on a real Mac: the keychain is ephemeral, and
          # a CI runner has no GUI session to show a prompt to anyway.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          # Prepend, don't replace: dropping the login keychain breaks other tools.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KEYCHAIN" \
                | awk '/Developer ID Application/ { print $2; exit }')"
          [ -n "$ID" ] || { echo "::error::no Developer ID Application identity in that .p12"; exit 1; }
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # notarytool's keychain profile needs a GUI-created keychain; an App Store
      # Connect API key is the headless equivalent.
      - name: Stage notary credentials
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/asc.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          echo "NOTARY_KEY_FILE=$KEY" >> "$GITHUB_ENV"

      - name: Build the DMG
        env:
          VERSION: ${{ inputs.version }}
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/make_dmg.sh "$VERSION"

      - name: Attach it to the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "Belfry-$VERSION.dmg" --clobber

      - name: Clean up credentials
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/sparkle_ed.key" || true
